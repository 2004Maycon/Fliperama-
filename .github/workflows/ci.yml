name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validar Lint, Build e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fliperama-local

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fliperama-local/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar Lint
        run: npm run lint

      - name: Validar Build e Tipagem
        run: npm run build

      - name: Executar Testes Automatizados
        run: npm test
